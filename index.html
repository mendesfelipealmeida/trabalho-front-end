<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Desenhos | Rick and Morty API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <p class="hero__eyebrow">Trabalho de Web Development Front-End</p>
    <h1>Portal de Desenhos</h1>
    <p class="hero__text">
      Consumo de dados em tempo real da API de Rick and Morty com criacao dinamica de cards via JavaScript.
    </p>
  </header>

  <main class="layout">
    <section class="panel panel--controls">
      <h2>Filtros</h2>
      <div class="controls-grid">
        <label>
          Buscar personagem
          <input type="search" id="searchInput" placeholder="Ex.: Rick, Morty, Summer">
        </label>

        <label>
          Status
          <select id="statusSelect">
            <option value="">Todos</option>
            <option value="alive">Vivo</option>
            <option value="dead">Morto</option>
            <option value="unknown">Desconhecido</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="searchBtn" type="button">Buscar</button>
        <button id="resetBtn" type="button" class="secondary">Limpar</button>
      </div>
    </section>

    <section class="panel panel--results">
      <div class="results-head">
        <h2>Personagens</h2>
        <p id="resultInfo">Carregando...</p>
      </div>

      <div id="cardsContainer" class="cards"></div>
      <p id="emptyState" class="empty" hidden>Nenhum personagem encontrado para esse filtro.</p>

      <div class="pagination">
        <button id="prevBtn" type="button" class="secondary">Pagina anterior</button>
        <span id="pageInfo">Pagina 1</span>
        <button id="nextBtn" type="button">Proxima pagina</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
